<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>학급 자리배치 프로그램 — KYUNGMINAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700;900&family=Poor+Story&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div id="sidebar">
  <div class="sb-body" id="sb-body">

    <!-- 명렬표 엑셀 관련 카드 -->
    <div class="card">
      <div class="card-head" style="display:flex; align-items:center; justify-content:space-between;">학생 명단
        <span id="btn-view-students" style="display:none; background:var(--accent); color:#fff; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:800; cursor:pointer; white-space:nowrap;" onclick="openStudentModal()"><span id="count-num">0</span>명</span>
      </div>
      <div class="card-body" style="display:flex; gap:6px;">
        <button class="exec-btn-sm" style="flex:1; background:#fff; color:var(--text1); border:1px solid var(--border2); box-shadow:none; font-weight:700; font-size:11px; padding:8px 4px; margin-bottom:0;" onclick="downloadTemplate()">명렬표 내려받기</button>
        <button class="exec-btn-sm" style="flex:1; background:var(--accent); color:#fff; border:none; box-shadow:none; font-weight:700; font-size:11px; padding:8px 4px; margin-bottom:0;" onclick="loadStudentExcel()">명렬표 불러오기</button>
      </div>
    </div>

    <!-- 책상 배열 카드 -->
    <div class="card">
      <div class="card-head">책상 배열
        <span class="badge" id="avail-badge">0석</span>
      </div>
      <div class="card-body">
        <select class="inp mb8" id="layout-type" onchange="onLayoutChange()">
          <option value="single">1인자리(개별)</option>
          <option value="pair">2인자리(짝꿍)</option>
          <option value="group">4인모둠(2x2)</option>
          <option value="group6">6인모둠(2x3)</option>
        </select>

        <div class="grid2 mb6">
          <div>
            <label class="lbl">책상 총수</label>
            <input class="inp inp-num" type="number" id="seat-count" min="1" max="60" value="30" onchange="onSeatCountChange()">
          </div>
          <div>
            <label class="lbl">분단(or 라인) 수</label>
            <input class="inp inp-num" type="number" id="col-count" min="1" max="10" value="5" onchange="onColCountChange()">
          </div>
        </div>
      </div>
    </div>

    <!-- 배치 기준 카드 -->
    <div class="card">
      <div class="card-head">배치 기준</div>
      <div class="card-body">
        <select class="inp mb6" id="sort-algo" onchange="onAlgoChange()"></select>
      </div>
    </div>

    <!-- 자리 배치 및 실행 카드 -->
    <div class="card">
      <div class="card-head">자리 배치 및 실행</div>
      <div class="card-body" style="display:flex; flex-direction:column; gap:8px;">
        <button class="exec-btn" style="width:100%; justify-content:center; padding:12px; font-size:15px;" onclick="executeArrangement()">자리 배치 실행</button>
        
        <div style="display:flex; align-items:center; justify-content:center; padding:4px 0;">
          <input type="checkbox" id="countdown-opt" style="cursor:pointer; width:15px; height:15px; accent-color:var(--accent);">
          <label for="countdown-opt" style="cursor:pointer; color:var(--text1); font-size:12px; font-weight:700; margin-left:6px;">5초 카운트다운</label>
        </div>

        <div style="display:flex; gap:5px; margin-top:4px;">
          <button class="exec-btn-sm" id="teacher-view-btn" style="flex:1; background:#fff; color:var(--text1); border:1px solid var(--border2); justify-content:center; padding:6px 2px; font-size:11px;" onclick="toggleTeacherView()">교사 시점</button>
          <button class="exec-btn-sm" style="flex:1; background:#fff; color:var(--text1); border:1px solid var(--border2); justify-content:center; padding:6px 2px; font-size:11px;" onclick="printScreen()">출력</button>
          <button class="exec-btn-sm" id="btn-save-pop" style="flex:1; background:var(--sidebar2); color:var(--text1); border:1px solid var(--border2); justify-content:center; position:relative; padding:6px 2px; font-size:11px;" onclick="toggleSaveMenu(event)">저장</button>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="sb-resizer"></div>

<div id="main">

  <div id="countdown-overlay">
    <div id="countdown-num"></div>
    <div id="countdown-label">자리 배치 공개까지...</div>
    <div id="countdown-cancel-info">클릭 또는 ESC를 누르면 배치를 취소합니다.</div>
  </div>

  <div id="workspace">
    <div id="board-area">
      <div class="blackboard" id="blackboard-el">칠판</div>
      <div class="board-spacer"></div>
      <div id="seats-wrap">
        <div id="seats-container" class="cols-container"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- 확인 모달 -->
<div id="confirm-modal" class="mbg" style="display:none; z-index:800;">
  <div class="modal">
    <div class="modal-msg" id="confirm-msg"></div>
    <div class="modal-btns">
      <button class="btn-ok" onclick="confirmOk()">확인</button>
      <button class="btn-cancel" onclick="confirmCancel()">취소</button>
    </div>
  </div>
</div>

<!-- 우클릭 컨텍스트 메뉴 -->
<div id="ctx-menu">
  <div class="ctx-head" id="ctx-head"></div>
  <div class="ctx-sep"></div>
  <div id="ctx-items"></div>
</div>

<!-- 불러온 명단 확인 모달 -->
<div id="student-list-modal" class="mbg" style="display:none; z-index:900;">
  <div class="modal" style="width: min(400px, 92vw); max-height:80vh; display:flex; flex-direction:column; padding:0; overflow:hidden; border-radius:16px;">
    <div style="padding:16px 20px; background:var(--accent); color:#fff; display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0; font-size:16px; color:#fff; font-weight:800;">현재 적용된 학생 명단</h3>
      <button onclick="closeStudentModal()" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer; line-height:1;">&times;</button>
    </div>
    <div id="modal-student-list-content" style="padding:16px; overflow-y:auto; flex:1; background:var(--bg);">
      <!-- students go here -->
    </div>
  </div>
</div>

<!-- 저장 옵션 팝오버 모달 -->
<div id="save-popover">
  <button class="pop-item-btn" onclick="exportToExcel(); hideSaveMenu();">엑셀 파일로 저장</button>
  <button class="pop-item-btn" onclick="saveAsImage(); hideSaveMenu();">이미지 파일로 저장</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
